name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW-w64 (32-bit)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: mingw-w64-i686-gcc mingw-w64-i686-binutils

      - name: Build version.dll
        shell: msys2 {0}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./build.ps1

      - name: Verify PE32 architecture and exports
        shell: msys2 {0}
        run: |
          objdump -f dist/version.dll | grep -q "pei-i386"
          for fn in GetFileVersionInfoA GetFileVersionInfoW GetFileVersionInfoSizeA GetFileVersionInfoSizeW VerQueryValueA VerQueryValueW; do
            objdump -p dist/version.dll | grep -q "$fn" || { echo "Missing export: $fn"; exit 1; }
          done

      - name: Package release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/pkg | Out-Null
          Copy-Item dist/version.dll, install.bat, install.ps1, README.md, LICENSE dist/pkg/
          Compress-Archive -Path dist/pkg/* -DestinationPath dist/tpad_utf8.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpad_utf8-version-dll
          path: |
            dist/version.dll
            dist/tpad_utf8.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/version.dll
            dist/tpad_utf8.zip
          generate_release_notes: true
